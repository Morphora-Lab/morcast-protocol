# Foundry configuration for the MORCast Payment Protocol.
# Reference: https://getfoundry.sh/config/reference/overview

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

# The compiler version is pinned so that local builds, CI and deployments all
# produce identical bytecode.
solc_version = "0.8.37"

# Base supports the Cancun instruction set. Cancun provides transient storage
# (EIP-1153), which the reentrancy guard uses.
evm_version = "cancun"

optimizer = true
optimizer_runs = 10_000

# Tests read the shared JSON test vectors in ./vectors.
fs_permissions = [{ access = "read", path = "./vectors" }]

# Fuzz tests generate random inputs for every test function that takes arguments.
[fuzz]
runs = 1_000

# Invariant tests call random sequences of handler functions and check that
# global properties hold after every call. Handlers only perform valid actions,
# so any revert is a failure.
[invariant]
runs = 256
depth = 100
fail_on_revert = true

# CI runs the same suites with more iterations.
[profile.ci.fuzz]
runs = 10_000

[profile.ci.invariant]
runs = 256
depth = 200

[fmt]
line_length = 100

[lint]
# Campaign deadlines are whole days (start, end, Day 5, Day 10). Validators can shift a block
# timestamp by seconds, which is irrelevant at that scale, so this lint is disabled.
exclude_lints = ["block-timestamp"]
