name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run that is still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    env:
      # The "ci" profile in foundry.toml runs more fuzz and invariant iterations.
      FOUNDRY_PROFILE: ci
      # Fork tests run against Base mainnet. A private endpoint can be provided as the
      # BASE_RPC_URL secret; otherwise the public endpoint is used.
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL || 'https://mainnet.base.org' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Check that the SDK ABI and code hash match the contract
        run: node sdk/scripts/generate-abi.mjs --check

      - name: Test
        run: forge test -vvv

  sdk:
    name: SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: sdk/package.json
          cache: true
          cache_dependency_path: sdk/pnpm-lock.yaml

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: sdk/package.json
          cache: true
          cache_dependency_path: sdk/pnpm-lock.yaml

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build SDK
        working-directory: sdk
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Deploy, settle, verify and claim on Anvil
        run: scripts/e2e-local.sh
